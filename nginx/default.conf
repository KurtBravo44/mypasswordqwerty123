server {
    listen       443 ssl;
    server_name  DOMAIN_NAME;

    ssl_certificate /etc/letsencrypt/live/gistura.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gistura.ru/privkey.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /jenkins/ {
        proxy_pass http://jenkins:8080;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}

