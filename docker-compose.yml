services:
  nginx:
    image: nginx:alpine-slim
    container_name: nginx
    restart: unless-stopped
    ports:
      - '443:443'
    volumes:
      - nginx_data:/etc/nginx/conf.d
      - serts:/etc/letsencrypt

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - '8080:8080'
    #  - '50000:50000'  # Нет необходимости, работа с Docker API
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - backend



volumes:
  nginx_data:
    name: nginx_data
  serts:
    name: serts
  jenkins_home:
    name: jenkins_home


